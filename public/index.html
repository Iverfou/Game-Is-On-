<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Veille & Concurrence</title>
  <!-- TailWind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

  <!-- Header -->
  <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
      <div>
        <h1 class="text-xl font-bold text-gray-900">Dashboard Veille & Concurrence</h1>
        <p class="text-xs text-gray-500" id="lastUpdate">Dernière mise à jour : --</p>
      </div>
      <button onclick="loadAll()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-md text-sm font-medium transition-colors">
        Actualiser
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 py-6">
    <!-- Message d'erreur -->
    <div id="errorMessage" class="hidden mb-6 p-4 bg-red-100 border border-red-400 text-red-700 rounded-md"></div>

    <!-- KPIs -->
    <section class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8" id="kpiContainer">
      <div class="bg-white p-4 rounded-lg border border-gray-200 shadow-sm">
        <p class="text-xs font-medium text-gray-500 uppercase">Total Publications</p>
        <p class="text-2xl font-bold text-gray-900 mt-1" id="kpiTotal">0</p>
      </div>
      <div class="bg-white p-4 rounded-lg border border-gray-200 shadow-sm">
        <p class="text-xs font-medium text-gray-500 uppercase">Avis Positifs</p>
        <p class="text-2xl font-bold text-green-600 mt-1" id="kpiPositive">0</p>
      </div>
      <div class="bg-white p-4 rounded-lg border border-gray-200 shadow-sm">
        <p class="text-xs font-medium text-gray-500 uppercase">Avis Négatifs</p>
        <p class="text-2xl font-bold text-red-600 mt-1" id="kpiNegative">0</p>
      </div>
      <div class="bg-white p-4 rounded-lg border border-gray-200 shadow-sm">
        <p class="text-xs font-medium text-gray-500 uppercase">Concurrents suivis</p>
        <p class="text-2xl font-bold text-blue-600 mt-1" id="kpiCompetitors">0</p>
      </div>
    </section>

    <!-- Liste / Feed -->
    <section class="bg-white rounded-lg border border-gray-200 shadow-sm p-6">
      <h2 class="text-lg font-semibold text-gray-900 mb-4">Dernières Publications & Avis</h2>
      <div id="reviewsContainer" class="space-y-4">
        <p class="text-sm text-gray-500">Chargement des données...</p>
      </div>
    </section>
  </main>

  <script>
    // ==========================================
    // 1. DÉCLARATION DES CONSTANTES AIRTABLE
    // ==========================================
    // Replacez par votre Token Airtable personnel
    const AT_TOKEN  = 'pat5S9nXdMMEYg4tg.9b5dc037ac95cfd149e3ab191c9c797b770c2d0397bdc21174a543b84e567926'; 
    const AT_BASE   = 'appTrL6dyikqGxZe4';
    const AT_CONC   = 'tblSiGUsTuXpEwioY'; // Table Concurrents
    const AT_VEILLE = 'tbl13Y1eW54aqPTxG'; // Table Veille / Publications

    // ==========================================
    // 2. DÉCLARATION DES VARIABLES GLOBALES
    // ==========================================
    window.AT_VEILLE = [];
    window.AT_CONCURRENTS = [];
    window.allRecords = [];
    window.allCompetitors = [];

    // ==========================================
    // 3. FONCTIONS D'APPEL AIRTABLE (FETCH)
    // ==========================================
    async function atFetchAll(tableId) {
      let records = [];
      let offset = '';

      do {
        const url = `https://api.airtable.com/v0/${AT_BASE}/${tableId}` + (offset ? `?offset=${offset}` : '');
        const res = await fetch(url, {
          headers: { Authorization: `Bearer ${AT_TOKEN}` }
        });

        if (!res.ok) {
          throw new Error(`Erreur Airtable (${tableId}): ${res.status} ${res.statusText}`);
        }

        const data = await res.json();
        records = records.concat(data.records || []);
        offset = data.offset;
      } while (offset);

      return records;
    }

    // ==========================================
    // 4. RENDU & INITIALISATION
    // ==========================================
    function showError(msg) {
      const errEl = document.getElementById('errorMessage');
      errEl.textContent = msg;
      errEl.classList.remove('hidden');
    }

    function hideError() {
      document.getElementById('errorMessage').classList.add('hidden');
    }

    function renderKPIs() {
      document.getElementById('kpiTotal').textContent = allRecords.length;
      document.getElementById('kpiCompetitors').textContent = allCompetitors.length;

      const positiveCount = allRecords.filter(r => (r.fields.Sentiment || '').toLowerCase() === 'positif').length;
      const negativeCount = allRecords.filter(r => (r.fields.Sentiment || '').toLowerCase() === 'négatif').length;

      document.getElementById('kpiPositive').textContent = positiveCount;
      document.getElementById('kpiNegative').textContent = negativeCount;
    }

    function renderReviews() {
      const container = document.getElementById('reviewsContainer');
      if (!allRecords.length) {
        container.innerHTML = `<p class="text-sm text-gray-500">Aucun enregistrement trouvé.</p>`;
        return;
      }

      container.innerHTML = allRecords.map(r => {
        const fields = r.fields || {};
        const title = fields.Titre || fields.Nom || 'Sans titre';
        const content = fields.Contenu || fields.Texte || fields.Notes || '';
        const date = fields.Date ? new Date(fields.Date).toLocaleDateString('fr-FR') : 'Date inconnue';

        return `
          <div class="p-4 border border-gray-100 bg-gray-50 rounded-md">
            <div class="flex justify-between items-start mb-1">
              <h3 class="text-sm font-semibold text-gray-800">${title}</h3>
              <span class="text-xs text-gray-400">${date}</span>
            </div>
            <p class="text-sm text-gray-600">${content}</p>
          </div>
        `;
      }).join('');
    }

    async function loadAll() {
      hideError();
      document.getElementById('lastUpdate').textContent = 'Actualisation en cours...';

      try {
        // Chargement parallèle des deux tables
        const [veilleRecords, competitorRecords] = await Promise.all([
          atFetchAll(AT_VEILLE),
          atFetchAll(AT_CONC)
        ]);

        // Stockage dans les variables globales
        allRecords = veilleRecords;
        allCompetitors = competitorRecords;

        window.AT_VEILLE = veilleRecords;
        window.AT_CONCURRENTS = competitorRecords;

        // Mise à jour de l'affichage
        renderKPIs();
        renderReviews();

        document.getElementById('lastUpdate').textContent = `Dernière mise à jour : ${new Date().toLocaleTimeString('fr-FR')}`;
      } catch (err) {
        console.error('Erreur lors du chargement :', err);
        showError(err.message);
        document.getElementById('lastUpdate').textContent = 'Erreur lors de la mise à jour';
      }
    }

    // Lancement au chargement de la page
    window.addEventListener('DOMContentLoaded', loadAll);
  </script>
</body>
</html>
